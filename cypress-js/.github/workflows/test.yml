name: test-cypress-js
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cypress-js
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cypress-js/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Verify the Cypress binary installed correctly
        run: npx cypress verify
      # Running the suite for real additionally requires a running FullTeaching SUT
      # (see ../deploy.sh / ../deploy.ps1) with SUT_URL pointing at it - not wired into CI
      # here, mirroring how selenium-java's E2E job also depends on a separately
      # provisioned SUT (see ../selenium-java/Jenkinsfile).
