# CI pipeline.
#   1. build-sut (first): fetches the FullTeaching SUT (retorch-st-fullteaching) with setup-sut.sh and builds its docker
#      image ONCE with the compose file shipped in the clone (sut/docker-compose.yml); the image is shared with
#      the E2E jobs as the "sut-image" artifact.
#   2. lint (Cypress), lint-playwright-csharp (build + format) and lint-puppeteer-python (flake8 + bridge syntax
#      check): run once the image is built.
#   3. e2e-cypress-javascript / e2e-playwright-csharp / e2e-puppeteer-python: only after their lint/build job
#      passes, all three in parallel. Each one runs on its own runner, deploys its own SUT instance with that same
#      sut/docker-compose.yml (.github/actions/start-sut, image loaded, no rebuild) and runs its suite against it.
#
# Triggers: push only on main + pull_request, so a PR branch is built once (on the PR), not once per trigger.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  DOTNET_VERSION: '8.0.x'
  SUT_COMPOSE_PROJECT: fullteaching
  SUT_URL: https://localhost:5000

jobs:
  lint:
    name: Cypress lint
    runs-on: ubuntu-latest
    needs: [build-sut]
    defaults:
      run:
        working-directory: cypress-js
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cypress-js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  build-sut:
    name: Build the SUT image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Fetches sut/ (compose file + sources) and selenium-java/ (both gitignored, never committed).
      - name: Fetch the SUT
        run: bash ./setup-sut.sh

      - name: Build the SUT image
        run: docker compose -f sut/docker-compose.yml -p "$SUT_COMPOSE_PROJECT" build full-teaching

      # The image name is generated by compose (<project>-<service>), so ask it instead of hardcoding it.
      - name: Save the SUT image
        run: |
          IMAGE="$(docker compose -f sut/docker-compose.yml -p "$SUT_COMPOSE_PROJECT" config --images | grep -v '^mysql:\|^openvidu/' | head -n1)"
          echo "Saving $IMAGE"
          mkdir -p "$RUNNER_TEMP/sut-image"
          docker save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/sut-image/full-teaching-sut.tar.gz"
          ls -lh "$RUNNER_TEMP/sut-image"

      - name: Upload the SUT image
        uses: actions/upload-artifact@v7
        with:
          name: sut-image
          path: ${{ runner.temp }}/sut-image/full-teaching-sut.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  e2e-cypress-javascript:
    name: "E2E: Cypress + JavaScript"
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cypress-js/package-lock.json

      - name: Install dependencies
        working-directory: cypress-js
        run: npm ci

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('cypress-js/package-lock.json') }}

      # npm >= 11 may skip the Cypress postinstall: verify/download the binary explicitly.
      - name: Install Cypress binary
        working-directory: cypress-js
        run: npx cypress install && npx cypress verify

      - name: Start the SUT
        uses: ./.github/actions/start-sut
        with:
          project: ${{ env.SUT_COMPOSE_PROJECT }}
          sut-url: ${{ env.SUT_URL }}

      - name: Run Cypress specs
        working-directory: cypress-js
        run: npx cypress run --browser chrome
        env:
          SUT_URL: ${{ env.SUT_URL }}

      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py --title "Cypress + JavaScript" --format junit 'cypress-js/results/*.xml'

      - name: Upload screenshots and JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-js-reports
          path: |
            cypress-js/cypress/screenshots/
            cypress-js/results/
          if-no-files-found: ignore

      - name: Dump SUT logs
        if: failure()
        run: |
          # sut/ is missing if an earlier step (e.g. setup-sut.sh) failed.
          [ -f sut/docker-compose.yml ] || { echo "sut/ not found, nothing to dump"; exit 0; }
          docker compose -f sut/docker-compose.yml -p "$SUT_COMPOSE_PROJECT" logs --no-color > "$RUNNER_TEMP/sut-logs.txt" 2>&1 || true
          tail -200 "$RUNNER_TEMP/sut-logs.txt"

      - name: Upload SUT logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sut-docker-logs
          path: ${{ runner.temp }}/sut-logs.txt
          if-no-files-found: ignore

      - name: Tear down the SUT
        if: always()
        run: |
          [ -f sut/docker-compose.yml ] || exit 0
          docker compose -f sut/docker-compose.yml -p "$SUT_COMPOSE_PROJECT" down -v || true

  lint-playwright-csharp:
    name: Playwright C# build & format
    runs-on: ubuntu-latest
    needs: [build-sut]
    defaults:
      run:
        working-directory: playwright-csharp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

  e2e-playwright-csharp:
    name: "E2E: Playwright + C#"
    runs-on: ubuntu-latest
    needs: [lint-playwright-csharp]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build
        working-directory: playwright-csharp
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('playwright-csharp/PlaywrightTests.csproj') }}

      # The browsers themselves are version-pinned by Microsoft.Playwright; --with-deps also installs the OS libraries.
      - name: Install Playwright browsers
        working-directory: playwright-csharp
        run: pwsh bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Start the SUT
        uses: ./.github/actions/start-sut
        with:
          project: ${{ env.SUT_COMPOSE_PROJECT }}
          sut-url: ${{ env.SUT_URL }}

      - name: Run Playwright tests
        working-directory: playwright-csharp
        run: >
          dotnet test --no-build --configuration Release --settings .runsettings
          --logger "trx;LogFileName=playwright-csharp.trx" --results-directory TestResults
        env:
          SUT_URL: ${{ env.SUT_URL }}

      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py --title "Playwright + C#" --format trx 'playwright-csharp/TestResults/*.trx'

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-csharp-reports
          path: playwright-csharp/TestResults/
          if-no-files-found: ignore

      - name: Dump SUT logs
        if: failure()
        run: |
          # sut/ is missing if an earlier step (e.g. setup-sut.sh) failed.
          [ -f sut/docker-compose.yml ] || { echo "sut/ not found, nothing to dump"; exit 0; }
          docker compose -f sut/docker-compose.yml -p "$SUT_COMPOSE_PROJECT" logs --no-color > "$RUNNER_TEMP/sut-logs.txt" 2>&1 || true
          tail -200 "$RUNNER_TEMP/sut-logs.txt"

      - name: Upload SUT logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sut-docker-logs-playwright-csharp
          path: ${{ runner.temp }}/sut-logs.txt
          if-no-files-found: ignore

      - name: Tear down the SUT
        if: always()
        run: |
          [ -f sut/docker-compose.yml ] || exit 0
          docker compose -f sut/docker-compose.yml -p "$SUT_COMPOSE_PROJECT" down -v || true

  lint-puppeteer-python:
    name: Puppeteer Python lint
    runs-on: ubuntu-latest
    needs: [build-sut]
    defaults:
      run:
        working-directory: puppeteer-python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: puppeteer-python/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pip install .

      - name: Lint (flake8)
        run: python -m flake8

      - name: Check the Puppeteer bridge syntax
        run: node --check bridge/server.mjs

  e2e-puppeteer-python:
    name: "E2E: Puppeteer + Python"
    runs-on: ubuntu-latest
    needs: [lint-puppeteer-python]
    timeout-minutes: 60
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: puppeteer-python/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: puppeteer-python/bridge/package-lock.json

      - name: Install Python dependencies
        working-directory: puppeteer-python
        run: pip install .

      # Puppeteer drives the Chrome preinstalled on the runner (channel "chrome"): no browser download.
      - name: Install the Puppeteer bridge
        working-directory: puppeteer-python/bridge
        run: PUPPETEER_SKIP_DOWNLOAD=true npm ci

      - name: Start the SUT
        uses: ./.github/actions/start-sut
        with:
          project: ${{ env.SUT_COMPOSE_PROJECT }}
          sut-url: ${{ env.SUT_URL }}

      - name: Run Puppeteer tests
        working-directory: puppeteer-python
        # JUnit XML (results/puppeteer.xml), coverage and the log file are configured in pyproject.toml.
        run: python -m pytest
        env:
          SUT_URL: ${{ env.SUT_URL }}

      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py --title "Puppeteer + Python" --format junit 'puppeteer-python/results/*.xml'

      - name: Upload JUnit results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: puppeteer-python-reports
          path: |
            puppeteer-python/results/
            puppeteer-python/logs/
          if-no-files-found: ignore

      - name: Dump SUT logs
        if: failure()
        run: |
          # sut/ is missing if an earlier step (e.g. setup-sut.sh) failed.
          [ -f sut/docker-compose.yml ] || { echo "sut/ not found, nothing to dump"; exit 0; }
          docker compose -f sut/docker-compose.yml -p "$SUT_COMPOSE_PROJECT" logs --no-color > "$RUNNER_TEMP/sut-logs.txt" 2>&1 || true
          tail -200 "$RUNNER_TEMP/sut-logs.txt"

      - name: Upload SUT logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sut-docker-logs-puppeteer-python
          path: ${{ runner.temp }}/sut-logs.txt
          if-no-files-found: ignore

      - name: Tear down the SUT
        if: always()
        run: |
          [ -f sut/docker-compose.yml ] || exit 0
          docker compose -f sut/docker-compose.yml -p "$SUT_COMPOSE_PROJECT" down -v || true
