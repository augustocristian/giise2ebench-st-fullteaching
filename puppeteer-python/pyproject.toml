[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "fullteaching_e2e" }]

[project]
name = "fullteaching-e2e-puppeteer-python"
version = "2.0.0"
dependencies = [
    "requests==2.34.2",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "pytest-html==4.2.0",
    "pytest-rerunfailures==16.7",
    "flake8==7.5.0",
]

requires-python = ">=3.12"

authors = [
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" }
]
maintainers = [
    { name = "Cristian Augusto", email = "augustocristian@uniovi.es" }
]

description = "FullTeaching E2E test suite implemented with Python and Puppeteer (current Puppeteer through a Node bridge), a RETORCH benchmark counterpart of the selenium-java suite"
readme = "README.md"

[project.urls]
Repository = "https://github.com/giis-uniovi/retorch-st-fullteaching"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=fullteaching_e2e --cov-report=xml:coverage.xml --cov-branch --junitxml=results/puppeteer.xml --strict-markers -ra"
markers = [
    "e2e: browser tests against the FullTeaching SUT - require Chrome, the Node bridge and a running SUT.",
    "bridge: smoke tests of the Python-Node Puppeteer bridge (tests/bridge) - no SUT required.",
    "media: tests that need live camera/microphone media: they run in their own Chrome and are re-run once on failure.",
    "video: live video session tests (several browsers, fake camera and microphone, OpenVidu).",
    "echat: chat tests inside a live video session.",
    "forum: course forum tests.",
    "course: course management tests (teacher and student).",
    "links: link navigation (spider) tests.",
    "rest: tests that exercise the REST operations of the SUT.",
    "user: user registration, login and profile tests.",
]
asyncio_mode = "auto"
# One loop for the whole session so the session-scoped browser can be shared.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

#Configurations related to logging in testing, first
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"
